shared_internal_contracts:
  inventory_validator:
    path: src/items/inventory.rs
    signature: "pub(crate) fn validate_integrity(&self) -> Result<(), ContainerExchangeError>"
    owner: inventory_crafting
    error: InvalidContainer only
    checks: "capacity==slots.len(); positive non-default/non-is_empty live stacks; equality-based per-item totals<=u32MAX"
    consumers: "built-in exchange/add; save maps InvalidInput; load maps InvalidData after normalization"
    public: false
  normalizer:
    path: src/items/inventory.rs
    signature: "pub(crate) fn normalize_quantities<I: ItemType>(quantities: &[(I,u32)]) -> Result<Vec<(I,u32)>, ContainerExchangeError>"
    owner: inventory_crafting
    error: InvalidRequest only
    semantics: "equality, first-occurrence order, zero ignored before sentinel checks, checked u32 aggregation, empty lists allowed"
    public: false
