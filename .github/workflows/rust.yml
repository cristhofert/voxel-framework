name: Rust CI

on:
  push:
    branches:
      - main
      - dev
      - 'codex/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV (Rust 1.89.0, library)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libwayland-dev libudev-dev

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Cargo.lock is not tracked by this library; resolve once on the MSRV.
      - name: Resolve CI lockfile
        run: cargo generate-lockfile

      - name: Check library with default features on MSRV
        run: cargo check --locked --lib

      - name: Check library without default features on MSRV
        run: cargo check --locked --lib --no-default-features

      - name: Check library with all features on MSRV
        run: cargo check --locked --lib --all-features

      - name: Test inventory, persistence, and crafting on MSRV
        run: |
          cargo test --locked --lib --no-default-features --features items,crafting items::inventory::tests
          cargo test --locked --lib --no-default-features --features items,crafting items::persistence::tests
          cargo test --locked --lib --no-default-features --features items,crafting crafting::tests

  check:
    name: Check (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default all targets
            command: cargo check --all-targets
          - mode: no default features
            command: cargo check --no-default-features
          - mode: all features all targets
            command: cargo check --all-features --all-targets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libwayland-dev libudev-dev

      - name: Run cargo check
        run: ${{ matrix.command }}

  test:
    name: Test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    # Keep Bevy test artifacts within the hosted runner's disk budget.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            command: cargo test
          - mode: no default features
            command: cargo test --no-default-features
          - mode: all features
            command: cargo test --all-features
          - mode: examples
            command: cargo test --examples
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libwayland-dev libudev-dev

      - name: Run cargo test
        run: ${{ matrix.command }}

  coverage:
    name: Coverage report (informational)
    runs-on: ubuntu-latest
    # Report only: coverage never blocks a merge.
    continue-on-error: true
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libwayland-dev libudev-dev

      - name: Measure coverage (default features)
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Write summary
        run: |
          {
            echo '## Line coverage (default features)'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  windows-inventory-persistence:
    name: Windows inventory persistence (items only)
    runs-on: windows-latest
    timeout-minutes: 60
    # No graphical examples, mobs, or full Windows gameplay test matrix.
    # Platform-specific permission/link cases are gated by the tests themselves.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-inventory-persistence

      - name: Resolve CI lockfile
        run: cargo generate-lockfile

      - name: Test inventory persistence only
        run: cargo test --locked --lib --no-default-features --features items items::persistence::tests

  docs-and-package:
    name: Docs and package audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install audio development dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Check docs
        run: cargo doc --no-deps --all-features

      - name: List package contents
        run: cargo package --list

      - name: Verify package can be created without building
        run: cargo package --no-verify
