name: Release preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without a v prefix (for example, 0.8.0)
        required: true
        type: string

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Keep Bevy test linking within the hosted runner's memory/disk budget.
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Rust MSRV
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update

      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libwayland-dev libudev-dev

      # Cargo.lock is ignored by this library; the preflight uses --locked.
      - name: Resolve CI lockfile
        run: cargo generate-lockfile

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run release preflight
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/release-preflight.sh "$RELEASE_VERSION"
