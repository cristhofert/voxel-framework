[package]
name = "voxel-framework"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A reusable voxel engine framework built on Bevy"
authors = ["Cristhofer <cristraviesodeleon@gmail.com>"]
license = "MIT"
repository = "https://github.com/cristhofert/voxel-framework"
readme = "README.md"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_render", "bevy_pbr", "bevy_core_pipeline", "multi_threaded",
    "bevy_ui", "bevy_text", "bevy_sprite", "bevy_state",
    "bevy_audio", "vorbis"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_winit", "wayland", "bevy_mesh", "bevy_audio", "vorbis"] }

[[example]]
name = "basic_world"
path = "examples/basic_world.rs"

[[example]]
name = "minetest"
path = "examples/minetest.rs"

# Optimize dependencies in debug builds for acceptable performance during development.
# Your own code stays unoptimized (fast recompile), Bevy and others run at near-release speed.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
