[package]
name = "voxel-framework"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "A reusable voxel engine framework built on Bevy"
authors = ["Cristhofer <cristraviesodeleon@gmail.com>"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/cristhofert/voxel-framework"
homepage = "https://github.com/cristhofert/voxel-framework"
documentation = "https://docs.rs/voxel-framework"
readme = "README.md"
keywords = ["voxel", "bevy", "gamedev", "voxel-engine", "procedural"]
categories = ["game-development", "rendering", "graphics"]
# Keep the crates.io package focused on public library source, docs, examples,
# runtime assets, and AI-consumption guides; exclude local workflow/spec/state.
exclude = [
    ".codex",
    ".codex/**",
    ".claude/**",
    ".atl/**",
    ".github/**",
    "openspec/**",
    "Cargo.toml.orig",
    "worlds/**",
    "CLAUDE.md",
    "docs/sdd/**",
]

# Build docs.rs pages with every feature so the full public API renders.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["items", "crafting", "mobs"]
# Items, inventory, drops, hotbar, and item-pickup UI.
items = []
# Crafting recipes and registry. Recipes consume items, so this implies `items`.
crafting = ["items"]
# Hostile/passive mob entities (AI, pathing, damage). Independent of `items`.
mobs = []
# Internal profiling spans for hot paths (mesh gen, chunk load, occlusion, collision, raycast).
# `tracing` is already a transitive dep of Bevy, but we still declare it as an
# optional direct dep so we can name it from our code under a feature gate.
tracing = ["dep:tracing"]
# Routes tracing spans to a Tracy profiler client. Implies tracing.
tracy = ["tracing", "dep:tracing-tracy", "dep:tracing-subscriber"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset", "bevy_render", "bevy_pbr", "bevy_core_pipeline", "multi_threaded",
    "bevy_ui", "bevy_text", "bevy_sprite", "bevy_state",
    "bevy_audio", "vorbis"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Profiling deps — pulled in only via the `tracing` / `tracy` features.
# Versions match what Bevy 0.18 transitively resolves to (tracing 0.1, tracing-subscriber 0.3).
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-tracy = { version = "0.11", optional = true }

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_winit", "wayland", "bevy_mesh", "bevy_audio", "vorbis"] }

[[example]]
name = "basic_world"
path = "examples/basic_world.rs"
required-features = ["items"]

[[example]]
name = "content_definitions"
path = "examples/content_definitions.rs"
required-features = ["items"]

[[example]]
name = "stats_definitions"
path = "examples/stats_definitions.rs"

[[example]]
name = "effect_definitions"
path = "examples/effect_definitions.rs"

[[example]]
name = "minetest"
path = "examples/minetest.rs"
required-features = ["items", "crafting", "mobs"]

# Optimize dependencies in debug builds for acceptable performance during development.
# Your own code stays unoptimized (fast recompile), Bevy and others run at near-release speed.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
